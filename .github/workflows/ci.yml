name: CI

# 三套测试跑在 Windows 上：数据层要读 GBK 编码的文件，
# 输入/视觉那几个模块直接用 ctypes 调 GDI 和 SendInput —— 换到 Linux 跑不了。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 必须显式指定依赖文件：setup-python 的 pip 缓存默认只找
          # requirements.txt / pyproject.toml，这个仓库两个都没有
          # （零依赖项目），不指定就会直接报 "No file ... matched"。
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # numpy 是视觉与标定模块的运行时依赖；Pillow 用于读模板与画标定核对图；
      # keyboard / pydirectinput 在这套代码里是**可选**依赖（injector.py 用 ctypes
      # 自己实现了扫描码发键与 GetAsyncKeyState 轮询）。装上是为了让 CI 跑
      # 和本地一致的代码路径。
      - name: 安装 Python 依赖
        run: pip install -r requirements-dev.txt

      - name: 数据对账（第二套实现独立复算 + 逐字比对）
        run: python tools/verify.py --samples 100

      - name: 前端核心逻辑测试
        run: node tools/test_core.mjs

      # 输入/热键类断言会先探测会话是否可交互；CI 上没有交互桌面，
      # 那两条会自动记为「跳过」并给出原因，不会冒充失败。
      - name: 采集链路测试
        run: python tools/test_rpa.py

      - name: ETL 幂等
        shell: pwsh
        run: |
          python tools/etl.py | Out-Null
          $a = (Get-FileHash data/points.min.json -Algorithm SHA256).Hash
          python tools/etl.py | Out-Null
          $b = (Get-FileHash data/points.min.json -Algorithm SHA256).Hash
          if ($a -ne $b) { throw "ETL 不是幂等的：$a != $b" }
          Write-Host "ETL 幂等 ✓"

      - name: 前端安装依赖
        working-directory: web
        run: npm ci

      - name: 前端类型检查与构建
        working-directory: web
        run: npm run build
