name: Deploy Pages

# 把 WebUI 部到 GitHub Pages。
# 刻意**重新构建**而不是直接发仓库里那份 dist/ —— 这样部署的产物一定是
# 当前 main 上 `web/` 源码构建出来的，不会出现「dist 忘了更新」这种静默不一致。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不取消正在进行的那个（避免线上被留在半成品状态）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 前端数据来自 data/，构建前要同步过去（npm run build 挂了 prebuild 会自动做，
      # 这里显式跑一次，日志里能看清楚数据是哪来的）
      - name: 同步数据到前端
        run: node tools/sync_web_data.mjs

      - name: 安装依赖并构建
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
