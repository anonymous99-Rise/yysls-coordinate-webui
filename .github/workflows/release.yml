name: Release

# 推 `v*` 标签时触发：跑测试 → 构建前端 → 打两个包 → 建 Release。
# 版本号和 CHANGELOG 由 tools/bump_version.py 在本地生成（见该文件头部说明），
# 这里只负责"把已经确定的版本变成可下载的产物"。
#
# 规矩：workflow 只做编排，任何有逻辑的东西都放进能本地单独跑通的脚本。
# 起因是发布说明最初写成内嵌的 PowerShell heredoc，YAML 块标量和它抢缩进，
# 直接把 workflow 弄成非法 YAML —— 嵌套引号/缩进这类问题这个项目踩过三次了。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布成 Release 的标签（如 v0.1.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # 发布前必须过测试。宁可这次不发，也不发一个数据对不上的版本。
      - name: 安装 Python 依赖
        run: pip install numpy Pillow keyboard pydirectinput

      - name: 发布前测试
        run: |
          python tools/verify.py --samples 100
          node tools/test_core.mjs
          python tools/test_rpa.py

      - name: 版本号自检（VERSION / package.json / 标签 三者一致）
        run: python tools/check_version_consistency.py --tag "$env:TAG"

      - name: 构建前端
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: 打包两个产物
        run: python tools/package_release.py --tag "$env:TAG"

      - name: 生成发布说明
        run: python tools/make_release_notes.py --out release-notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$env:TAG" --title "$env:TAG" --notes-file release-notes.md "yysls-webui-$env:TAG.zip" "yysls-rpa-toolkit-$env:TAG.zip"
